<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sem conexão</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b0b;color:#f4f1ea;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px}
  main{max-width:360px}
  h1{font-size:24px;margin:0 0 8px}
  p{color:#a9a49a;line-height:1.5;margin:0 0 20px}
  button{background:#f0b429;color:#151515;border:0;border-radius:10px;padding:12px 20px;font-size:16px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>Você está sem internet</h1>
  <p>Para agendar ou usar o painel é preciso estar conectado. Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
  <button onclick="location.reload()">Tentar de novo</button>
</main>
</body>
</html>
