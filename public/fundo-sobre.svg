<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14110b"/>
      <stop offset="0.55" stop-color="#0d0d0d"/>
      <stop offset="1" stop-color="#17130a"/>
    </linearGradient>
    <radialGradient id="brilho" cx="12%" cy="18%" r="55%">
      <stop offset="0" stop-color="#f0b429" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#f0b429" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brilho2" cx="92%" cy="88%" r="50%">
      <stop offset="0" stop-color="#f0b429" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#f0b429" stop-opacity="0"/>
    </radialGradient>
    <pattern id="riscos" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(-38)">
      <rect width="26" height="26" fill="none"/>
      <rect width="2" height="26" fill="#f0b429" opacity="0.07"/>
    </pattern>
    <pattern id="pontos" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#f0b429" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#base)"/>
  <rect width="1600" height="900" fill="url(#riscos)"/>
  <rect width="1600" height="900" fill="url(#brilho)"/>
  <rect width="1600" height="900" fill="url(#brilho2)"/>

  <!-- faixa de poste de barbearia, inclinada, no canto -->
  <g opacity="0.32" transform="rotate(-38 40 900)">
    <rect x="-300" y="720" width="900" height="26" fill="#a8332b" opacity="0.5"/>
    <rect x="-300" y="752" width="900" height="26" fill="#e9e3d6" opacity="0.4"/>
    <rect x="-300" y="784" width="900" height="26" fill="#27528f" opacity="0.5"/>
  </g>

  <!-- aros dourados -->
  <g fill="none" stroke="#f0b429">
    <circle cx="1480" cy="120" r="210" stroke-width="1.5" opacity="0.2"/>
    <circle cx="1480" cy="120" r="150" stroke-width="1" stroke-dasharray="3 9" opacity="0.3"/>
    <circle cx="1480" cy="120" r="90" stroke-width="1.5" opacity="0.18"/>
  </g>
  <rect x="1180" y="560" width="360" height="260" fill="url(#pontos)"/>

  <!-- tesoura fantasma -->
  <g fill="none" stroke="#f0b429" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.18" transform="translate(120 120) rotate(24) scale(0.9)">
    <circle cx="40" cy="170" r="48"/>
    <circle cx="150" cy="188" r="48"/>
    <path d="M70 128 L470 -60 L486 -42 L96 148 Z"/>
    <path d="M128 146 L486 -10 L494 12 L152 168 Z"/>
  </g>
</svg>
